# Alembic for developers running the CLI from the repository root:
#
#     uv run alembic upgrade head
#     uv run alembic revision --autogenerate -m "what changed"
#
# The database URL is deliberately left empty: env.py reads it from Settings, so there is exactly
# one place that knows it and no chance of this file drifting from .env.
[alembic]
script_location = src/smith/migrations
prepend_sys_path = src
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
